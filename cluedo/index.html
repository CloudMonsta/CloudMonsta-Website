<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cluedo Detective Sheet</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f7f7f7;
      color: #333;
      padding: 20px;
      margin: 0;
    }

    h1, h2 {
      text-align: center;
    }

    .section {
      max-width: 600px;
      margin: 30px auto;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background-color: #f0f0f0;
    }

    .selectable {
      cursor: pointer;
      font-size: 1.4em;
      transition: background-color 0.3s;
      user-select: none;
    }

    .selectable:hover {
      background-color: #f2f2f2;
    }

    .tick {
      color: green;
    }

    .cross {
      color: red;
    }

    /* Privacy overlay styles */
    #privacyOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      backdrop-filter: blur(10px);
      background-color: rgba(0,0,0,0.4);
      z-index: 9999;
      display: none;
      cursor: pointer;
    }

    /* Buttons container */
    #buttons {
      text-align: center;
      margin-bottom: 10px;
    }

    /* Privacy toggle and Reset button styles */
    button {
      margin: 0 8px 20px;
      padding: 10px 16px;
      background-color: #0078d4;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      user-select: none;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #005a9e;
    }

    #privacyToggle {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 10000;
      margin: 0;
    }
  </style>
</head>
<body>

  <div id="buttons">
    <button id="resetBtn">Reset Sheet</button>
  </div>

  <button id="privacyToggle">Privacy Mode</button>
  <div id="privacyOverlay" title="Click to show sheet"></div>

  <h1>Cluedo Detective Sheet</h1>

  <div id="charactersSection" class="section">
    <h2>Characters</h2>
    <table>
      <thead>
        <tr><th>Name</th><th>Mark</th></tr>
      </thead>
      <tbody>
        <!-- Will be filled dynamically -->
      </tbody>
    </table>
  </div>

  <div id="weaponsSection" class="section">
    <h2>Weapons</h2>
    <table>
      <thead>
        <tr><th>Weapon</th><th>Mark</th></tr>
      </thead>
      <tbody>
        <!-- Will be filled dynamically -->
      </tbody>
    </table>
  </div>

  <div id="roomsSection" class="section">
    <h2>Rooms</h2>
    <table>
      <thead>
        <tr><th>Room</th><th>Mark</th></tr>
      </thead>
      <tbody>
        <!-- Will be filled dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    // Data arrays
    const characters = [
      "Miss Scarlet",
      "Colonel Mustard",
      "Professor Plum",
      "Mrs Peacock",
      "Reverend Green",
      "Mrs White"
    ];

    const weapons = [
      "Candlestick",
      "Dagger",
      "Lead Pipe",
      "Revolver",
      "Rope",
      "Wrench"
    ];

    const rooms = [
      "Kitchen",
      "Ballroom",
      "Conservatory",
      "Dining Room",
      "Billiard Room",
      "Library",
      "Lounge",
      "Hall",
      "Study"
    ];

    // Shuffle helper function (Fisher-Yates)
    function shuffle(array) {
      let currentIndex = array.length, randomIndex;

      while (currentIndex !== 0) {
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;
        [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
      }
      return array;
    }

    // Render function to create tables with shuffled data
    function renderSection(sectionId, items, label) {
      const tbody = document.querySelector(`#${sectionId} tbody`);
      tbody.innerHTML = ''; // clear existing rows

      items.forEach(item => {
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.textContent = item;

        const tdMark = document.createElement('td');
        tdMark.classList.add('selectable');
        tdMark.setAttribute('data-state', '');
        tdMark.addEventListener('click', () => {
          const state = tdMark.getAttribute('data-state');
          if (state === '') {
            tdMark.textContent = '✔';
            tdMark.className = 'selectable tick';
            tdMark.setAttribute('data-state', 'tick');
          } else if (state === 'tick') {
            tdMark.textContent = '✘';
            tdMark.className = 'selectable cross';
            tdMark.setAttribute('data-state', 'cross');
          } else {
            tdMark.textContent = '';
            tdMark.className = 'selectable';
            tdMark.setAttribute('data-state', '');
          }
        });

        tr.appendChild(tdName);
        tr.appendChild(tdMark);
        tbody.appendChild(tr);
      });
    }

    // Render all sections with shuffled data
    function renderAll() {
      renderSection('charactersSection', shuffle([...characters]), 'Characters');
      renderSection('weaponsSection', shuffle([...weapons]), 'Weapons');
      renderSection('roomsSection', shuffle([...rooms]), 'Rooms');
    }

    // Reset all marks and reshuffle
    document.getElementById('resetBtn').addEventListener('click', () => {
      renderAll();
    });

    // Privacy toggle logic
    const privacyBtn = document.getElementById('privacyToggle');
    const overlay = document.getElementById('privacyOverlay');
    let privacyOn = false;

    privacyBtn.addEventListener('click', () => {
      privacyOn = !privacyOn;
      if (privacyOn) {
        overlay.style.display = 'block';
        privacyBtn.textContent = 'Show Sheet';
      } else {
        overlay.style.display = 'none';
        privacyBtn.textContent = 'Privacy Mode';
      }
    });

    overlay.addEventListener('click', () => {
      privacyOn = false;
      overlay.style.display = 'none';
      privacyBtn.textContent = 'Privacy Mode';
    });

    // Initial render on page load
    renderAll();
  </script>

</body>
</html>
